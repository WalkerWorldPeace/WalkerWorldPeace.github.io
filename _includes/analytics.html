{% assign analytics_id = site.google_analytics_id | default: "" | strip %}
{% assign analytics_prefix = analytics_id | slice: 0, 2 %}
{% if page.analytics != false and analytics_prefix == "G-" and analytics_id.size > 2 %}

<!-- Global site tag (gtag.js) - Google Analytics -->
<script async src="https://www.googletagmanager.com/gtag/js?id={{ analytics_id | escape }}"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());

  gtag('config', {{ analytics_id | jsonify }});
</script>

{% endif %}
